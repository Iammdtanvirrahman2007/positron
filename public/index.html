<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Positron AI</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#181a22;--line:#292c38;--text:#eef0f6;--muted:#9298aa;--accent:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex}
aside{width:260px;background:#14151c;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.brand{font-size:19px;font-weight:750;letter-spacing:.2px;display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#38bdf8);display:grid;place-items:center;font-weight:800}
button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#222530;color:var(--text);border-radius:10px;padding:10px 12px}button:hover{border-color:#7770a7}.new{width:100%;text-align:left}.hint{color:var(--muted);font-size:12px;margin-top:auto}
main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}.top select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:9px;max-width:min(60vw,440px)}
.status{font-size:12px;color:var(--muted)}#messages{flex:1;overflow:auto;padding:28px 18px 18px}.welcome{max-width:720px;margin:12vh auto;text-align:center}.welcome h1{font-size:34px;margin:0 0 8px}.welcome p{color:var(--muted)}.msg{max-width:820px;margin:0 auto 22px;display:flex;gap:14px}.avatar{flex:0 0 32px;height:32px;border-radius:10px;background:#292c38;display:grid;place-items:center;font-size:13px}.msg.user .avatar{background:#493d75}.content{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}.content pre{white-space:pre;overflow:auto;background:#0b0c10;padding:14px;border:1px solid var(--line);border-radius:10px}.content code{font-family:ui-monospace,monospace}.composer{width:min(850px,calc(100% - 32px));margin:0 auto 24px;border:1px solid #383b49;border-radius:16px;background:var(--panel);padding:12px;box-shadow:0 10px 40px #0004}.composer textarea{display:block;width:100%;resize:vertical;min-height:62px;max-height:220px;background:transparent;color:var(--text);border:0;outline:0;padding:8px}.composer-foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.send{background:#8b5cf6;border:0;color:white;font-weight:650;padding:9px 18px}.send:disabled{opacity:.5;cursor:wait}.error{color:#fca5a5;max-width:820px;margin:0 auto 16px}.mobile{display:none}
@media(max-width:680px){aside{display:none}.top{padding:0 12px}.top select{max-width:70vw}#messages{padding:16px 12px}.welcome h1{font-size:27px}}
</style>
</head>
<body>
<aside><div class="brand"><div class="logo">P</div> Positron AI</div><button class="new" id="newChat">＋ New chat</button><div class="hint">Private API connection<br>Powered by Tokens.bd</div></aside>
<main><header class="top"><div><strong>Chat</strong><div class="status" id="status">Connecting…</div></div><select id="model" aria-label="Choose model"><option>Loading models…</option></select></header>
<section id="messages"><div class="welcome" id="welcome"><h1>What are we building?</h1><p>Choose a model and start a conversation.</p></div></section>
<form class="composer" id="form"><textarea id="prompt" placeholder="Message Positron AI…" rows="2" required></textarea><div class="composer-foot"><span>Enter to send · Shift + Enter for newline</span><button class="send" id="send" type="submit">Send ↑</button></div></form>
</main>
<script>
const $=s=>document.querySelector(s), messages=[], modelSelect=$("#model");
function addMessage(role,text){$("#welcome")?.remove();const el=document.createElement("article");el.className="msg "+role;const av=document.createElement("div");av.className="avatar";av.textContent=role==="user"?"You":"AI";const body=document.createElement("div");body.className="content";body.textContent=text;el.append(av,body);$("#messages").append(el);$("#messages").scrollTop=$("#messages").scrollHeight;return body}
async function loadModels(){try{const r=await fetch("/api/models");const d=await r.json();if(!r.ok)throw Error(d.error);modelSelect.innerHTML="";const list=d.models||[];if(!list.length)throw Error("No models are available for this API key.");for(const m of list){const o=document.createElement("option");o.value=m.id;o.textContent=m.name;modelSelect.append(o)}$("#status").textContent=list.length+" models available"}catch(e){$("#status").textContent="API not connected";addMessage("assistant","Setup: "+e.message+"\n\nCreate a .env file from .env.example, add your Tokens API key, then restart the server.")}}
$("#form").addEventListener("submit",async e=>{e.preventDefault();const input=$("#prompt"),text=input.value.trim();if(!text||!modelSelect.value)return;input.value="";messages.push({role:"user",content:text});addMessage("user",text);const output=addMessage("assistant","");$("#send").disabled=true;$("#status").textContent="Thinking…";try{const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:modelSelect.value,messages,max_tokens:4096})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||d.error||"Request failed");const answer=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n")||"No text response.";output.textContent=answer;messages.push({role:"assistant",content:answer});$("#status").textContent="Ready"}catch(err){output.textContent="Error: "+err.message;messages.pop();$("#status").textContent="Request failed"}finally{$("#send").disabled=false;input.focus()}});
$("#newChat").addEventListener("click",()=>{messages.length=0;$("#messages").innerHTML='<div class="welcome" id="welcome"><h1>What are we building?</h1><p>Choose a model and start a conversation.</p></div>';$("#prompt").focus()});
$("#prompt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#form").requestSubmit()}});
loadModels();
</script></body></html>
